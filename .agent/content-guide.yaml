# Content Management Guide
# Machine-readable taxonomy for Word And Mouth content

---
version: "1.0"
last_updated: "2026-01-12"

# Tenets (Core Pillars)
tenets:
  - id: story
    label: "Story"
    description: "Messaging, positioning, narrative"
    keywords: ["messaging", "positioning", "brand story", "value proposition", "pitch", "narrative"]
  
  - id: clarity
    label: "Clarity"
    description: "Simplifying complexity, documentation"
    keywords: ["simplify", "complexity", "documentation", "processes", "alignment"]
  
  - id: insight
    label: "Insight"
    description: "Pattern detection, synthesis, analysis"
    keywords: ["patterns", "data", "analysis", "synthesis", "research", "trends"]
  
  - id: ai
    label: "AI"
    description: "AI strategy, implementation, products"
    keywords: ["ai", "automation", "prompts", "llm", "machine learning", "agents"]
  
  - id: growth
    label: "Growth"
    description: "Scaling, optimization, strategy"
    keywords: ["growth", "scale", "revenue", "optimization", "strategy"]

# Industries (Sectors)
industries:
  - id: saas
